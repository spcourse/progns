_settings:
    start_date: 31/8/26
    end_date: 1/1/27

templates:
    1: &module
        type: integer
        subgrades:
            percentage_correct: integer
        automatic:
            percentage_correct: correctness_score*100
        calculation: percentage_correct == 100 && -1 || 0
        hide_calculated: true
        auto_publish: true
        allow_resubmit: true

grades:
    hello:
        type: pass
        subgrades:
            correct: boolean
        automatic:
            correct: correctness_score == 1 && -1 || 0
        calculation: correct
        auto_publish: true
        hide_calculated: true
    module1:
        <<: *module
        deadline: 14/9/26 11:00
    module2:
        <<: *module
        deadline: 28/9/26 11:00
    module3:
        <<: *module
        deadline: 12/10/26 11:00
    module4:
        type: integer
        subgrades:
            percentage_correct: integer
        automatic:
            percentage_correct: correctness_score*100
        calculation: checks/100*9+1
        hide_calculated: true
        auto_publish: true
        allow_resubmit: true
        deadline: 19/10/26 11:00
    oefententamen:
        type: float
        subgrades:
            punten: float
        calculation: (punten.to_f / 10 * 9 + 1).round(1)
    tentamen:
        type: float
        subgrades:
            punten: float
        calculation: (punten.to_f / 10 * 9 + 1).round(1)
    hertentamen:
        type: float
        subgrades:
            punten: float
        calculation: (punten.to_f / 10 * 9 + 1).round(1)

calculation:
    eindcijfer:
        tentamen: 1
    resit:
        hertentamen: 1

opdrachten:
    show_progress: true
    submits:
        hello: 0
        module1: 1
        module2: 1
        module3: 1
        module4: 1

oefententamen:
    show_overview: true
    submits:
        oefententamen: 1

tentamen:
    show_overview: true
    required: true
    submits:
        tentamen: 1

hertentamen:
    show_overview: true
    required: true
    submits:
        hertentamen: 1
